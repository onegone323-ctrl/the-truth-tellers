<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="https://media.base44.com/images/public/6a97b3175d08a6bc8bc635af/925825601_DOWNSIZET4C.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <link rel="manifest" href="/manifest.json" />
    <title>Truth 4 Clarity</title>
    <script>
      // Apply the saved (or system) theme before first paint — no flash.
      (function () {
        try {
          var stored = localStorage.getItem("truth-teller-theme");
          var light =
            stored === "light" ||
            ((stored === null || stored === "system") &&
              window.matchMedia("(prefers-color-scheme: light)").matches);
          document.documentElement.classList.toggle("dark", !light);
          document.documentElement.classList.toggle("light", light);
          document.documentElement.style.colorScheme = light ? "light" : "dark";
        } catch (e) {}
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Inter:wght@300;400;500;600&display=swap" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
